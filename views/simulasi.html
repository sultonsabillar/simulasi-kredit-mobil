<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulasi Kredit Mobil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <!-- Start Screen -->
    <div id="startScreen" class="text-center">
      <h1 class="mb-4">Selamat Datang di Simulasi Kredit Mobil</h1>
      <button id="startBtn" class="btn btn-success btn-lg">Mulai Simulasi</button>
    </div>

    <!-- Form Simulasi -->
    <div id="simulasiForm" style="display:none;">
      <div class="card mb-4">
        <div class="card-header">Input Data Kredit</div>
        <div class="card-body">
          <form id="kreditForm">
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="kontrakNo" class="form-label">KONTRAK_NO</label>
                  <input type="text" class="form-control" id="kontrakNo" name="kontrakNo" required value="AGR00001">
                </div>
                <div class="mb-3">
                  <label for="clientName" class="form-label">CLIENT NAME</label>
                  <input type="text" class="form-control" id="clientName" name="clientName" required value="SUGUS">
                </div>
                <div class="mb-3">
                  <label for="otr" class="form-label">Harga Mobil (OTR)</label>
                  <input type="number" class="form-control" id="otr" name="otr" required value="240000000">
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="dp" class="form-label">Down Payment (%)</label>
                  <input type="number" class="form-control" id="dp" name="dp" required value="20">
                </div>
                <div class="mb-3">
                  <label for="jangkaWaktu" class="form-label">Jangka Waktu (bulan)</label>
                  <input type="number" class="form-control" id="jangkaWaktu" name="jangkaWaktu" required value="18">
                </div>
                <div class="mb-3">
                  <label for="tanggalMulai" class="form-label">Tanggal Mulai Angsuran</label>
                  <input type="date" class="form-control" id="tanggalMulai" name="tanggalMulai" required value="2024-01-25">
                </div>
              </div>
            </div>
            <button type="submit" class="btn btn-primary">Hitung Angsuran</button>
          </form>
        </div>
      </div>
      <div id="hasil" style="display:none;">
        <div class="card mb-4">
          <div class="card-header">Hasil Perhitungan</div>
          <div class="card-body">
            <table class="table table-bordered mb-0">
              <tr><th>KONTRAK_NO</th><td id="hasilKontrakNo"></td></tr>
              <tr><th>CLIENT NAME</th><td id="hasilClientName"></td></tr>
              <tr><th>OTR</th><td id="hasilOtr"></td></tr>
              <tr><th>Pokok Utang</th><td id="pokokUtang"></td></tr>
              <tr><th>Bunga (%)</th><td id="bungaPersen"></td></tr>
              <tr><th>Total Bunga</th><td id="totalBunga"></td></tr>
              <tr><th>Angsuran per Bulan</th><td id="angsuranPerBulan"></td></tr>
            </table>
          </div>
        </div>
        <div class="card">
          <div class="card-header">Jadwal Angsuran</div>
          <div class="card-body">
            <table class="table table-striped" id="jadwal-table">
              <thead>
                <tr>
                  <th>KONTRAK_NO</th>
                  <th>ANGSURAN_KE</th>
                  <th>ANGSURAN_PER_BULAN</th>
                  <th>TANGGAL_JATUH_TEMPO</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    document.getElementById('startBtn').onclick = function() {
      document.getElementById('startScreen').style.display = 'none';
      document.getElementById('simulasiForm').style.display = 'block';
    };

    document.getElementById('kreditForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const kontrakNo = document.getElementById('kontrakNo').value;
      const clientName = document.getElementById('clientName').value;
      const otr = parseInt(document.getElementById('otr').value);
      const dpPersen = parseFloat(document.getElementById('dp').value);
      const jangkaWaktu = parseInt(document.getElementById('jangkaWaktu').value);
      const tanggalMulai = document.getElementById('tanggalMulai').value;

      // Hitung DP dan Pokok Utang
      const dp = otr * (dpPersen / 100);
      const pokokUtang = otr - dp;

      // Tentukan bunga bertingkat
      let bungaPersen = 0;
      if (jangkaWaktu <= 12) {
        bungaPersen = 12;
      } else if (jangkaWaktu <= 24) {
        bungaPersen = 14;
      } else {
        bungaPersen = 16.5;
      }

      // Hitung total bunga dan angsuran per bulan
      const totalBunga = pokokUtang * (bungaPersen / 100);
      const angsuranPerBulan = Math.round((pokokUtang + totalBunga) / jangkaWaktu);

      // Tampilkan hasil
      document.getElementById('hasil').style.display = 'block';
      document.getElementById('hasilKontrakNo').textContent = kontrakNo;
      document.getElementById('hasilClientName').textContent = clientName;
      document.getElementById('hasilOtr').textContent = 'Rp ' + otr.toLocaleString('id-ID');
      document.getElementById('pokokUtang').textContent = 'Rp ' + pokokUtang.toLocaleString('id-ID');
      document.getElementById('bungaPersen').textContent = bungaPersen + '%';
      document.getElementById('totalBunga').textContent = 'Rp ' + totalBunga.toLocaleString('id-ID');
      document.getElementById('angsuranPerBulan').textContent = 'Rp ' + angsuranPerBulan.toLocaleString('id-ID');

      // Generate jadwal angsuran
      const tbody = document.querySelector('#jadwal-table tbody');
      tbody.innerHTML = '';
      let tgl = new Date(tanggalMulai);
      for (let i = 1; i <= jangkaWaktu; i++) {
        // Format tanggal ke YYYY-MM-DD
        const yyyy = tgl.getFullYear();
        const mm = String(tgl.getMonth() + 1).padStart(2, '0');
        const dd = String(tgl.getDate()).padStart(2, '0');
        const tanggalJatuhTempo = `${yyyy}-${mm}-${dd}`;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${kontrakNo}</td>
          <td>${i}</td>
          <td>Rp ${angsuranPerBulan.toLocaleString('id-ID')}</td>
          <td>${tanggalJatuhTempo}</td>
        `;
        tbody.appendChild(tr);
        // Tambah 1 bulan
        tgl.setMonth(tgl.getMonth() + 1);
      }
    });
  </script>
</body>
</html>
